name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Follows the floor in go.mod rather than pinning a second version here.
          go-version-file: go.mod
      - run: go vet ./...
      # cgo is on by default on this runner, which go-sqlite3 needs.
      - run: go test ./...
